name: C++ formatting

on:
  pull_request:

permissions:
  contents: read

jobs:
  clang-format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned formatter
        run: python -m pip install -r tools/format-requirements.txt
      - name: Check changed C/C++ files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python tools/check_format.py --base "$BASE_SHA"
